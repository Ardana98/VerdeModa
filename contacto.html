<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerdeModa - Contacto</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <header class="header">
        <nav class="navbar navbar-expand-lg ">
            <div class="container-fluid">
                <a class="navbar-brand" href="./index.html">
                     <img src="assets/img/l.png" alt="Logo VerdeModa" class="logo" height="40">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="./index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./contacto.html">Contacto</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <section>
            <h1 class="text-center mb-4">Contacto</h1>
            <p class="text-center lead mb-5">
                Si tienes alguna pregunta, no dudes en contactarnos.
            </p>

            <form class="contact-form needs-validation" novalidate>
                <div class="mb-3 form-group">
                    <label for="name" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="name" required>
                    <div class="invalid-feedback">
                        Por favor, ingresa tu nombre.
                    </div>
                </div>

                <div class="mb-3 form-group">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" required>
                    <div class="invalid-feedback">
                        Por favor, ingresa un correo electrónico válido.
                    </div>
                </div>

                <div class="mb-3 form-group">
                    <label for="subject" class="form-label">Asunto</label>
                    <input type="text" class="form-control" id="subject" required>
                    <div class="invalid-feedback">
                        Por favor, ingresa el asunto.
                    </div>
                </div>

                <div class="mb-3 form-group">
                    <label for="message" class="form-label">Mensaje</label>
                    <textarea class="form-control" id="message" rows="5" required></textarea>
                    <div class="invalid-feedback">
                        Por favor, ingresa tu mensaje.
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Enviar Mensaje</button>
            </form>
        </section>
    </main>

    <footer class="footer mt-auto py-3">
        <div class="container text-center">
            <p class="mb-0">&copy; 2025 VerdeModa. Todos los derechos reservados.</p>
        </div>
    </footer>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/contacto.js"></script>
</body>
</html>
